<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600">
<title>Bus I2C: maestro y dos esclavos</title>
<desc>Raspberry Pi Pico conectada a una OLED y un sensor mediante las lineas compartidas SDA y SCL.</desc>
<style>
text{font-family:Arial,Helvetica,sans-serif;fill:#17212b}.box{stroke-width:3}.head{font-size:25px;font-weight:bold;text-anchor:middle}.detail{font-size:21px;text-anchor:middle}.wire{fill:none;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
</style>
<defs>
<marker id="ar" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#d92d20"/></marker>
<marker id="ab" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#1769aa"/></marker>
</defs>
<!-- Maestro -->
<rect class="box" x="450" y="28" width="300" height="100" rx="16" fill="#d9eaf7" stroke="#245580"/>
<text class="head" x="600" y="68">MAESTRO</text><text class="detail" x="600" y="98">Raspberry Pi Pico</text>
<!-- Dos cables compartidos -->
<path class="wire" d="M100 245 H1145" stroke="#d92d20" marker-end="url(#ar)"/>
<path class="wire" d="M100 295 H1145" stroke="#1769aa" marker-end="url(#ab)"/>
<text x="25" y="253" font-size="23" font-weight="bold" fill="#d92d20">SDA</text>
<text x="25" y="303" font-size="23" font-weight="bold" fill="#1769aa">SCL</text>
<!-- Conexiones maestro -->
<path class="wire" d="M545 128 V245" stroke="#d92d20"/><path class="wire" d="M655 128 V295" stroke="#1769aa"/>
<circle cx="545" cy="245" r="7" fill="#d92d20"/><circle cx="655" cy="295" r="7" fill="#1769aa"/>
<!-- OLED -->
<path class="wire" d="M300 245 V385" stroke="#d92d20"/><path class="wire" d="M370 295 V385" stroke="#1769aa"/>
<circle cx="300" cy="245" r="7" fill="#d92d20"/><circle cx="370" cy="295" r="7" fill="#1769aa"/>
<rect class="box" x="205" y="385" width="260" height="150" rx="16" fill="#dff0d8" stroke="#237a35"/>
<text class="head" x="335" y="425">ESCLAVO 1</text><text class="detail" x="335" y="458">Pantalla OLED</text><text class="detail" x="335" y="486">(SSD1306)</text><text class="detail" x="335" y="515">Direccion: 0x3C</text>
<!-- Sensor -->
<path class="wire" d="M850 245 V385" stroke="#d92d20"/><path class="wire" d="M920 295 V385" stroke="#1769aa"/>
<circle cx="850" cy="245" r="7" fill="#d92d20"/><circle cx="920" cy="295" r="7" fill="#1769aa"/>
<rect class="box" x="790" y="385" width="260" height="150" rx="16" fill="#fce5cd" stroke="#b45f06"/>
<text class="head" x="920" y="425">ESCLAVO 2</text><text class="detail" x="920" y="458">Sensor I2C</text><text class="detail" x="920" y="486">(ej. BME280)</text><text class="detail" x="920" y="515">Direccion: 0x76</text>
<!-- Resistencias pull-up -->
<text x="135" y="48" font-size="23" font-weight="bold">3.3 V</text><path d="M120 72 H245" stroke="#333" stroke-width="4" stroke-linecap="round"/>
<path d="M155 72 V92 l-10 8 20 12 -20 12 20 12 -20 12 20 12 -10 8 V245" fill="none" stroke="#333" stroke-width="3.5" stroke-linejoin="round"/>
<path d="M210 72 V92 l-10 8 20 12 -20 12 20 12 -20 12 20 12 -10 8 V295" fill="none" stroke="#333" stroke-width="3.5" stroke-linejoin="round"/>
<path class="wire" d="M155 190 V245" stroke="#d92d20"/><path class="wire" d="M210 190 V295" stroke="#1769aa"/>
<text x="65" y="155" font-size="18">4.7 kOhm</text><text x="220" y="155" font-size="18">4.7 kOhm</text>
<circle cx="155" cy="245" r="7" fill="#d92d20"/><circle cx="210" cy="295" r="7" fill="#1769aa"/>
<!-- Tierra -->
<path d="M770 128 V158 M750 158 H790 M756 167 H784 M763 176 H777" fill="none" stroke="#333" stroke-width="3.5" stroke-linecap="round"/><text x="800" y="165" font-size="20">GND comun</text>
<text x="600" y="575" font-size="16" text-anchor="middle" fill="#555">Esquema conceptual: SDA y SCL son lineas compartidas por ambos dispositivos.</text>
</svg>
