```svg
<svg xmlns="http://www.w3.org/2000/svg" width="720" height="320" viewBox="0 0 720 320">
  <style>
    .device {
      fill: #eaf2f8;
      stroke: #245580;
      stroke-width: 2;
      rx: 8;
    }
    .title {
      font: bold 17px sans-serif;
      fill: #17365d;
      text-anchor: middle;
    }
    .label {
      font: 14px sans-serif;
      fill: #222;
      text-anchor: middle;
    }
    .bus {
      stroke: #333;
      stroke-width: 2.5;
      fill: none;
    }
    .bus-label {
      font: bold 14px sans-serif;
      fill: #222;
    }
  </style>

  <!-- Maestro -->
  <rect class="device" x="250" y="20" width="220" height="65"/>
  <text class="title" x="360" y="47">MAESTRO</text>
  <text class="label" x="360" y="68">Raspberry Pi Pico</text>

  <!-- Esclavo 1 -->
  <rect class="device" x="70" y="220" width="220" height="65"/>
  <text class="title" x="180" y="247">ESCLAVO 1</text>
  <text class="label" x="180" y="268">Pantalla OLED</text>

  <!-- Esclavo 2 -->
  <rect class="device" x="430" y="220" width="220" height="65"/>
  <text class="title" x="540" y="247">ESCLAVO 2</text>
  <text class="label" x="540" y="268">Sensor I²C</text>

  <!-- Conexiones SDA y SCL -->
  <path class="bus" d="M 290 85 V 125 H 180 V 220"/>
  <path class="bus" d="M 430 85 V 155 H 540 V 220"/>

  <!-- Etiquetas -->
  <text class="bus-label" x="205" y="119">SDA</text>
  <text class="bus-label" x="475" y="149">SCL</text>
</svg>
```
