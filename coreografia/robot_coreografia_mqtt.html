    <script>
        const mqttStatus = document.getElementById("mqttStatus");
        let mqttClient = null;
        const savedSequences = Object.create(null);
        const scheduledTimers = Object.create(null);

        const robotIds = [12, 14, 16, 18, 32, 34, 36, 38, 11, 13, 15, 17, 19, 31, 33, 35, 37, 39];
        const robotById = new Map();

        function getTargetRobot(robotId) {
            const robot = robotById.get(Number(robotId));
            return {index: Number(robotId), robot};
        }

        // Convert the MQTT schema in the MQTT topic specification into the
        // internal Robot format: v in dm/s, w and arm angles in radians, time in seconds.
        // Linear velocity is NOT rescaled: the Three.js world uses decimeters.
        function normalizeState(payload) {
            const isMqttFormat =
                Object.prototype.hasOwnProperty.call(payload, "v_dm/s") ||
                Object.prototype.hasOwnProperty.call(payload, "w_deg/s") ||
                Object.prototype.hasOwnProperty.call(payload, "alpha0_deg") ||
                Object.prototype.hasOwnProperty.call(payload, "alpha1_deg") ||
                Object.prototype.hasOwnProperty.call(payload, "alpha2_deg") ||
                Object.prototype.hasOwnProperty.call(payload, "duration_s");

            const step = isMqttFormat ? {
                v: Number(payload["v_dm/s"] ?? 0),
                w: Number(payload["w_deg/s"] ?? 0) * Math.PI / 180,
                alpha0: Number(payload.alpha0_deg ?? 0) * Math.PI / 180,
                alpha1: Number(payload.alpha1_deg ?? 0) * Math.PI / 180,
                alpha2: Number(payload.alpha2_deg ?? 0) * Math.PI / 180,
                time: Math.max(0.01, Number(payload.duration_s ?? 1.0))
            } : {
                // Already-normalized internal sequence: v is dm/s; angles and w are radians.
                v: Number(payload.v ?? 0),
                w: Number(payload.w ?? 0),
                alpha0: Number(payload.alpha0 ?? 0),
                alpha1: Number(payload.alpha1 ?? 0),
                alpha2: Number(payload.alpha2 ?? 0),
                time: Math.max(0.01, Number(payload.time ?? 1.0))
            };

            if (![step.v, step.w, step.alpha0, step.alpha1, step.alpha2, step.time].every(Number.isFinite)) {
                throw new Error("State fields must be numeric; expected v_dm/s, w_deg/s, alpha0_deg, alpha1_deg, alpha2_deg and duration_s");
            }
            return step;
        }

        function stateFromMqtt(payload) {
            if (!payload || typeof payload !== "object" || Array.isArray(payload)) {
                throw new Error("State payload must be a JSON object");
            }
            return normalizeState(payload);
        }

        function handleStateMessage(payload, robotId) {
            try {
                const {index, robot} = getTargetRobot(robotId);
                if (!robot) throw new Error("Robot index is out of range");
                robot.setSequence([stateFromMqtt(payload)]);
                selectedRobot = robot;
                setMqttStatus("State received → Robot " + index, true);
            } catch (error) {
                console.error("Invalid state message", error);
                setMqttStatus("State error: " + error.message);
            }
        }

        function handleSequenceMessage(payload, robotId) {
            try {
                if (!payload || typeof payload.action !== "string") throw new Error("Sequence payload needs an action");
                const name = String(payload.name || "");
                if (!name) throw new Error("Sequence payload needs a name");

                if (payload.action === "create") {
                    if (!Array.isArray(payload.states) || payload.states.length === 0) {
                        throw new Error("Create action needs a non-empty states array");
                    }
                    savedSequences[name] = payload.states.map(stateFromMqtt);
                    // In this project create + run_at:"now" means create and start immediately.
                    if (payload.run_at === "now") {
                        const {robot} = getTargetRobot(robotId);
                        if (!robot) throw new Error("No simulated robot mapped to ID " + robotId);
                        robot.setSequence(savedSequences[name].map(step => ({...step})));
                        selectedRobot = robot;
                        setMqttStatus('Sequence "' + name + '" created and running on Robot ' + robotId, true);
                    } else {
                        setMqttStatus('Sequence "' + name + '" saved (' + savedSequences[name].length + ' states)', true);
                    }
                    return;
                }

                if (payload.action === "delete") {
                    delete savedSequences[name];
                    if (scheduledTimers[name]) {
                        clearTimeout(scheduledTimers[name]);
                        delete scheduledTimers[name];
                    }
                    setMqttStatus('Sequence "' + name + '" deleted', true);
                    return;
                }

                if (payload.action === "schedule") {
                    const sequence = savedSequences[name];
                    if (!sequence) throw new Error('Unknown sequence "' + name + '"; create it first');
                    const runAt = payload.run_at || "now";
                    const delay = runAt === "now" ? 0 : Date.parse(runAt) - Date.now();
                    if (!Number.isFinite(delay)) throw new Error("Invalid run_at date");
                    if (scheduledTimers[name]) clearTimeout(scheduledTimers[name]);
                    scheduledTimers[name] = setTimeout(() => {
                        const {index, robot} = getTargetRobot(robotId);
                        if (!robot) {
                            setMqttStatus("Scheduled sequence failed: robot index is out of range");
                        } else {
                            robot.setSequence(sequence.map(step => ({...step})));
                            selectedRobot = robot;
                            setMqttStatus('Running sequence "' + name + '" on Robot ' + index, true);
                        }
                        delete scheduledTimers[name];
                    }, Math.max(0, delay));
                    setMqttStatus(delay <= 0 ? 'Starting sequence "' + name + '"' :
                        'Sequence "' + name + '" scheduled for ' + new Date(Date.now() + delay).toLocaleString(), true);
                    return;
                }
                throw new Error("Unknown sequence action: " + payload.action);
            } catch (error) {
                console.error("Invalid sequence message", error);
                setMqttStatus("Sequence error: " + error.message);
            }
        }

        function setMqttStatus(message, connected = false) {
            const status = document.getElementById("mqttStatus");
            if (!status) return;
            status.textContent = message;
            status.style.color = connected ? "#137333" : "#b3261e";
        }

        function subscribeToRobotCommands() {
            const prefix = document.getElementById("topicPrefix").value.trim().replace(/^\/+|\/+$/g, "");
            const sequenceTopic = `${prefix}/+/motion/sequence`;
            const stateTopic = `${prefix}/+/motion/state`;
            mqttClient.subscribe([sequenceTopic, stateTopic], {qos: 0}, error => {
                if (error) {
                    setMqttStatus("Error al suscribirse: " + error.message);
                    return;
                }
                setMqttStatus("Conectado y suscrito: " + sequenceTopic, true);
            });
        }

        function processIncomingMqtt(topic, message) {
            const prefix = document.getElementById("topicPrefix").value.trim().replace(/^\/+|\/+$/g, "");
            const match = topic.match(new RegExp("^" + prefix.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + "/robot(\\d+)/motion/(sequence|state)$"));
            if (!match) return;
            const robotId = Number(match[1]);
            try {
                const payload = JSON.parse(message.toString());
                if (match[2] === "sequence") handleSequenceMessage(payload, robotId);
                else handleStateMessage(payload, robotId);
            } catch (error) {
                console.error("Invalid MQTT message", topic, error);
                setMqttStatus("Mensaje inválido en " + topic + ": " + error.message);
            }
        }

        function getBrokerWebSocketUrl() {
            let value = document.getElementById("brokerUrl").value.trim();
            if (!value) throw new Error("Indica la dirección del broker");
            if (!/^wss?:\/\//i.test(value)) value = "wss://" + value;

            const url = new URL(value);
            if (url.protocol !== "wss:" && url.protocol !== "ws:") {
                throw new Error("El broker debe usar ws:// o wss://");
            }
            if (!url.pathname || url.pathname === "/") url.pathname = "/mqtt";
            return url.toString();
        }

        function validateMqttCommands() {
            const prefix = document.getElementById("topicPrefix").value.trim().replace(/^\/+|\/+$/g, "");
            if (!prefix) throw new Error("El prefijo MQTT no puede estar vacío");

            let commands;
            try {
                commands = JSON.parse(document.getElementById("mqttCommands").value);
            } catch (error) {
                throw new Error("JSON de comandos inválido: " + error.message);
            }

            if (!Array.isArray(commands) || commands.length === 0) {
                throw new Error("Comandos debe ser una lista JSON no vacía");
            }

            commands.forEach((command, index) => {
                if (!command || !Array.isArray(command.robots) || command.robots.length === 0) {
                    throw new Error(`Comando ${index + 1}: robots debe ser una lista no vacía`);
                }
                if (typeof command.sufijo !== "string" || !command.sufijo.trim()) {
                    throw new Error(`Comando ${index + 1}: falta el sufijo del topic`);
                }
                if (!command.payload || typeof command.payload !== "object" || Array.isArray(command.payload)) {
                    throw new Error(`Comando ${index + 1}: payload debe ser un objeto JSON`);
                }
                command.robots.forEach(robotId => {
                    if (!Number.isInteger(robotId) || robotId < 0) {
                        throw new Error(`Comando ${index + 1}: ID de robot inválido (${robotId})`);
                    }
                });
            });

            return {prefix, commands};
        }

        function publishMqttCommands() {
            let data;
            try {
                data = validateMqttCommands();
            } catch (error) {
                setMqttStatus(error.message);
                return;
            }

            const messages = [];
            data.commands.forEach(command => {
                const suffix = command.sufijo.trim().replace(/^\/+|\/+$/g, "");
                command.robots.forEach(robotId => {
                    messages.push({
                        topic: `${data.prefix}/robot${robotId}/${suffix}`,
                        payload: JSON.stringify(command.payload)
                    });
                });
            });

            let completed = 0;
            let succeeded = 0;
            let failed = 0;
            setMqttStatus(`Enviando ${messages.length} mensajes…`, true);

            messages.forEach(message => {
                mqttClient.publish(message.topic, message.payload, {qos: 0, retain: false}, error => {
                    completed++;
                    if (error) {
                        failed++;
                        console.error("MQTT publish failed:", message.topic, error);
                    } else {
                        succeeded++;
                        console.log("MQTT published:", message.topic, message.payload);
                    }

                    if (completed === messages.length) {
                        setMqttStatus(
                            `Envío terminado: ${succeeded}/${messages.length} mensajes publicados` +
                            (failed ? `; ${failed} errores (consulta la consola)` : ""),
                            failed === 0
                        );
                    }
                });
            });
        }

        function connectAndPublishMqtt(shouldPublish = true) {
            if (typeof mqtt === "undefined") {
                setMqttStatus("MQTT.js no se cargó; revisa la conexión a Internet");
                return;
            }

            let brokerUrl;
            try {
                brokerUrl = getBrokerWebSocketUrl();
                validateMqttCommands();
            } catch (error) {
                setMqttStatus(error.message);
                return;
            }

            if (mqttClient && mqttClient.connected) {
                if (shouldPublish) publishMqttCommands();
                else setMqttStatus("Conectado y escuchando comandos MQTT", true);
                return;
            }

            if (mqttClient) {
                try { mqttClient.end(true); } catch (_) {}
                mqttClient = null;
            }

            setMqttStatus("Conectando a " + brokerUrl + "…");
            mqttClient = mqtt.connect(brokerUrl, {
                clean: true,
                connectTimeout: 15000,
                reconnectPeriod: 0,
                clientId: "carrobotWeb_" + Math.random().toString(16).slice(2, 10)
            });

            let finished = false;
            mqttClient.once("connect", () => {
                finished = true;
                subscribeToRobotCommands();
                if (shouldPublish) setTimeout(() => publishMqttCommands(), 250);
            });

            mqttClient.on("message", processIncomingMqtt);

            mqttClient.on("error", error => {
                console.error("MQTT error:", error);
                setMqttStatus("Error MQTT: " + error.message);
            });

            mqttClient.on("close", () => {
                if (!finished) setMqttStatus("No se pudo establecer la conexión con el broker");
            });
        }

        document.getElementById("mqttSend").addEventListener("click", () => connectAndPublishMqtt(true));
        document.getElementById("mqttListen").addEventListener("click", () => connectAndPublishMqtt(false));
        /////////////////////////////////////////////////



        class Robot {
            constructor(scene, options = {}) {
                this.state = {
                    x: options.x ?? 0,
                    y: options.y ?? 0,
                    beta: options.beta ?? 0,
                    alpha0: options.alpha0 ?? 0,
                    alpha1: options.alpha1 ?? 0,
                    alpha2: options.alpha2 ?? 0,
                };

                this.group = new THREE.Group();
                scene.add(this.group);

                this._build();

                this.sequence = [];
                this.currentStep = null;
                this.timeLeft = 0;
                this.initialAngles = {};
            }

            _build() {
                const base = new THREE.Mesh(
                    new THREE.BoxGeometry(2, 0.5, 2),//(1, 0.3, .8),
                    new THREE.MeshBasicMaterial({color: 0x0077ff})
                );
                base.position.y = 0.3
                this.group.add(base);
                this.base = base;

                const wheelGeometry = new THREE.CylinderGeometry(0.4, 0.4, 0.5, 32);//(0.2, 0.2, 0.3, 32);
                const wheelMaterial = new THREE.MeshBasicMaterial({color: 0x222222});

                const wheelOffsets = [
                    [0.7, 0.4, 1.2],
                    [0.7, 0.4, -1.2],
                    [-0.7, 0.4, 1.2],
                    [-0.7, 0.4, -1.2],
                ];

                // const wheelOffsets = [
                //   [0.4, 0, 0.6],
                //   [0.4, 0, -0.6],
                //   [-0.4, 0, 0.6],
                //   [-0.4, 0, -0.6],
                // ];

                wheelOffsets.forEach(([x, y, z]) => {
                    const wheel = new THREE.Mesh(wheelGeometry, wheelMaterial);
                    wheel.rotation.x = Math.PI / 2;
                    wheel.position.set(x, y, z);
                    this.group.add(wheel);
                });

                const color_brazo = 0x00fff0;
                const a1 = 0.5;
                const a2 = 1;
                const a3 = 1;

                let geometry = new THREE.BoxGeometry(0.5, a1, 0.5);
                let material = new THREE.MeshBasicMaterial({color: color_brazo});
                const armBase = new THREE.Mesh(geometry, material);
                armBase.translateY(a1 / 2);
                armBase.translateX(0.6);
                base.add(armBase);
                this.armBase = armBase;

                let shoulder = new THREE.Object3D();
                shoulder.translateY(a1 / 2);
                armBase.add(shoulder);
                this.shoulder = shoulder;

                geometry = new THREE.BoxGeometry(a2, 0.2, 0.2);
                let lowerArm = new THREE.Mesh(geometry, material);
                lowerArm.translateX(a2 / 2);
                shoulder.add(lowerArm);

                let elbow = new THREE.Object3D();
                elbow.translateX(a2 / 2);
                lowerArm.add(elbow);
                this.elbow = elbow;

                geometry = new THREE.BoxGeometry(a3, 0.1, 0.1);
                let arm = new THREE.Mesh(geometry, material);
                arm.translateX(a3 / 2);
                elbow.add(arm);

                let wrist = new THREE.Object3D();
                wrist.translateX(a3 / 2);
                arm.add(wrist);

                geometry = new THREE.TorusGeometry(0.1, 0.01, 3, 9, 5.6);
                let hand = new THREE.Mesh(geometry, material);
                hand.rotation.y = Math.PI / 2;
                hand.rotation.x = Math.PI / 2;
                wrist.add(hand);
            }

            moveTo(delta = {}) {
                Object.entries(delta).forEach(([key, value]) => {
                    if (this.state.hasOwnProperty(key)) {
                        this.state[key] += value;
                    }
                });
            }

            setSequence(sequence) {
                this.sequence = sequence.map(normalizeState);
                this.currentStep = null;
                this.timeLeft = 0;
            }

            _startNextStep() {
                if (this.sequence.length === 0) {
                    this.currentStep = null;
                    return;
                }
                this.currentStep = this.sequence.shift();
                this.timeLeft = this.currentStep.time;

                this.initialAngles = {
                    alpha0: this.state.alpha0,
                    alpha1: this.state.alpha1,
                    alpha2: this.state.alpha2,
                };
            }

            update(deltaTime) {
                if (!this.currentStep) {
                    this._startNextStep();
                    if (!this.currentStep) {
                        this._render();
                        return;
                    }
                }

                const {
                    x = this.state.x,
                    y = this.state.y,
                    beta = this.state.beta,
                    v = this.state.v,
                    w = this.state.w,
                    alpha0 = this.state.alpha0,
                    alpha1 = this.state.alpha1,
                    alpha2 = this.state.alpha2,
                } = this.currentStep;

                this.state.x += v * Math.cos(this.state.beta) * deltaTime;
                this.state.y -= v * Math.sin(this.state.beta) * deltaTime;
                this.state.beta += (this.currentStep.w ?? 0) * deltaTime;

                const t = 1 - this.timeLeft / this.currentStep.time;

                ["alpha0", "alpha1", "alpha2"].forEach((key) => {
                    if (this.currentStep[key] !== undefined) {
                        const start = this.initialAngles[key];
                        const end = this.currentStep[key];
                        this.state[key] = start + (end - start) * t;
                    }
                });

                this.timeLeft -= deltaTime;
                if (this.timeLeft <= 0) {
                    this._startNextStep();
                }

                this._render();
            }

            _render() {
                this.group.position.set(this.state.x, 0, this.state.y);
                this.group.rotation.y = this.state.beta;

                this.armBase.rotation.y = this.state.alpha0;
                this.shoulder.rotation.z = this.state.alpha1;
                this.elbow.rotation.z = this.state.alpha2 - this.state.alpha1;
            }
        }

        const height = window.innerHeight / 2;

        scene.background = new THREE.Color(0xf4f4f8);

        const camera1 = new THREE.PerspectiveCamera(60, width / height, 0.1, 1000);
        camera1.position.set(0, 25, 25);
        camera1.lookAt(0, 0, 0);

        const camera2 = new THREE.PerspectiveCamera(30, 320 / 240, 0.1, 1000);
        //camera2.position.set(0, 25, 25);
        //camera2.lookAt(0, 0, 0);

        const renderer1 = new THREE.WebGLRenderer();

        function generateTileVariants(n, size = 256, chips = 150) {
            const arr = [];
            for (let k = 0; k < n; k++) {
                const c = document.createElement('canvas');
                c.width = c.height = size;
                const ctx = c.getContext('2d');

                // fondo cemento (ligeramente variable)
                const base = 220 + Math.floor((Math.random() - 0.5) * 18);
                ctx.fillStyle = `rgb(${base}, ${base}, ${base})`;
                ctx.fillRect(0, 0, size, size);

                // pintar chips (aleatorio)
                for (let i = 0; i < chips; i++) {
                    const x = Math.random() * size;
                    const y = Math.random() * size;
                    const r = 3 + Math.random() * 14;
                    ctx.beginPath();
                    // forma irregular simple con 5 vértices
                    for (let p = 0; p < 5; p++) {
                        const angle = (p / 5) * Math.PI * 2;
                        const rr = r * (0.5 + Math.random() * 1.0);
                        const px = x + Math.cos(angle) * rr;
                        const py = y + Math.sin(angle) * rr;
                        if (p === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
                    }
                    ctx.closePath();

                    // color de chip — gris/beige con ligera variación
                    const gbase = 100 + Math.random() * 100;
                    const rcol = Math.floor(gbase + (Math.random() - 0.5) * 30);
                    const gcol = Math.floor(gbase + (Math.random() - 0.5) * 30);
                    const bcol = Math.floor(gbase + (Math.random() - 0.5) * 30);
                    ctx.fillStyle = `rgb(${rcol},${gcol},${bcol})`;
                    ctx.fill();

                    // opcional borde oscuro muy sutil para profundidad
                    if (Math.random() < 0.12) {
                        ctx.strokeStyle = "rgba(0,0,0,0.06)";
                        ctx.lineWidth = Math.max(1, Math.random() * 2);
                        ctx.stroke();
                    }
                }

                // // brillo local: pinta un gradiente sutil para simular barniz desigual
                // const g = ctx.createLinearGradient(0, 0, size, size);
                // g.addColorStop(0, 'rgba(255,255,255,0.00)');
                // g.addColorStop(1, 'rgba(255,255,255,0.03)');
                // ctx.fillStyle = g;
                // ctx.fillRect(0,0,size,size);

                const tex = new THREE.CanvasTexture(c);
                tex.encoding = THREE.sRGBEncoding;
                tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
                tex.repeat.set(1, 1);
                arr.push(tex);
            }
            return arr;
        }
        ////////////////////////
        const variants = generateTileVariants(tileVariants);

        // ---------- crear piso con baldosas individuales ----------
        const floorGroup = new THREE.Group();
        floorGroup.name = "floorGroup";

        const tileGeo = new THREE.PlaneGeometry(tileSize, tileSize);
        // small offset so we can "see" joints (gap)
        const jointGap = 0.002; // 2mm gap between tiles
        const effectiveTile = tileSize - jointGap;

        for (let ix = 0; ix < tilesX; ix++) {
            for (let iz = 0; iz < tilesZ; iz++) {
                const variantIndex = Math.floor(Math.random() * variants.length);
                const tex = variants[variantIndex];

                // para menos repetición, rotamos la textura 0/90/180/270 aleatoriamente
                const rotation = Math.floor(Math.random() * 4) * (Math.PI / 2);
                // clonamos material por baldosa (se puede optimizar agrupando por variante)
                const mat = new THREE.MeshPhysicalMaterial({
                    map: tex,
                    roughness: 0.55 + Math.random() * 0.15,
                    metalness: 0.0,
                    clearcoat: 0.5,
                    clearcoatRoughness: 0.08 + Math.random() * 0.08,
                    side: THREE.DoubleSide
                });

                const tile = new THREE.Mesh(tileGeo, mat);
                tile.rotation.x = -Math.PI / 2;
                tile.position.x = (ix + 0.5) * tileSize - corridorWidth / 2;
                tile.position.z = (iz + 0.5) * tileSize - corridorLength / 2;
                tile.position.y = 0.0005; // elevar ligeramente para evitar z-fighting con base

                // aplicar rotación de UV a la textura: usamos rotation en la textura
                tex.center.set(0.5, 0.5);
                tex.rotation = rotation;

                // escalar ligeramente la malla para crear juntas visibles (no la textura)
                tile.scale.set(effectiveTile / tileSize, 1, effectiveTile / tileSize);

                tile.receiveShadow = true;
                floorGroup.add(tile);
            }
        }

        scene.add(floorGroup);

        // const ceilingGeo = new THREE.PlaneGeometry(corridorWidth + 0.2, corridorLength + 0.2);
        // const ceilingMat = new THREE.MeshStandardMaterial({ color: 0xffffff, side: THREE.DoubleSide });

        // ceiling.rotation.x = Math.PI/2;
        // ceiling.position.y = wallHeight + 0.01;
        // scene.add(ceiling);

        // ---------- puertas cada 5 metros ----------
        // colocamos puertas en ambas paredes, inicio a 2.5m, luego +5m (por tanto posiciones a z = -7.5, -2.5, 2.5, 7.5 ?)
        // para un corridor de 20m, colocamos puertas centradas cada 5m empezando desde z = - (L/2) + 2.5
        const doorInterval = 50.0;
        const doorPositionsZ = [];
        for (let z = -corridorLength / 2 + doorInterval / 2; z < corridorLength / 2 + 0.0001; z += doorInterval) {
            doorPositionsZ.push(parseFloat(z.toFixed(6)));
        }

        // puerta como marco sencillo (ancho 0.9m, alto 2.0m, profundidad 0.05)
        const doorWidth = 9;
        const doorHeight = 20.0;
        const doorDepth = 0.5;
        const woodMat = new THREE.MeshStandardMaterial({color: 0x8b5a2b, metalness: 0.05, roughness: 0.6});

        doorPositionsZ.forEach((zpos) => {
            // lado derecho (pared x = +width/2)
            const rightDoorGeo = new THREE.BoxGeometry(doorDepth, doorHeight, doorWidth);
            const rightDoor = new THREE.Mesh(rightDoorGeo, woodMat);
            //rightDoor.rotation.y = Math.PI/2;
            rightDoor.position.set(corridorWidth / 2 + wallThickness / 2 + doorDepth / 2 - 0.5, doorHeight / 2, zpos);
            scene.add(rightDoor);

            // lado izquierdo (pared x = -width/2)
            const leftDoorGeo = new THREE.BoxGeometry(doorDepth, doorHeight, doorWidth);
            const leftDoor = new THREE.Mesh(leftDoorGeo, woodMat);
            //leftDoor.rotation.y = -Math.PI/2;
            leftDoor.position.set(-corridorWidth / 2 - wallThickness / 2 - doorDepth / 2 + 0.5, doorHeight / 2, zpos);
            scene.add(leftDoor);
        });


        ///////////////////// Robots

        const n_bots = robotIds.length;
        const robots = [];

        const beat = 1;
        const n_beats = 5;
        const tiempo = n_beats * beat;
        const d = 1;
        const R = 2.5;
        const omega = Math.PI / tiempo;
        const vel_lin = omega * R;

        for (let i = 0; i < n_bots; i++) {
            // Arrange robots along the corridor (world Z axis), not across its width.
            const robot = new Robot(scene, {x: 0, y: (i - (n_bots - 1) / 2) * 8});
            robots.push(robot);
            robotById.set(robotIds[i], robot);
        }

function set_sequences() {

        if (i % 2 === 0) {

        let lastTime = performance.now();
        const keys = {};
        selectedRobot = robots[0]
        updateCameraView()

        //camera2.position.set(0, 25, 25);
        //camera2.lookAt(0, 0, 0);


        ///////////// Teclados y Botones

        window.addEventListener("keydown", (e) => {
            keys[e.code] = true;
            if (e.code.startsWith("Digit")) {
                const idx = parseInt(e.code.replace("Digit", ""));
                if (robots[idx]) {
                    selectedRobot = robots[idx];
                    console.log(`Robot ${idx} seleccionado`);
                }
            }
            if (["KeyS", "KeyP", "KeyT", "KeyB"].includes(e.code)) {
                cameraMode = e.code.replace("Key", "");
                console.log(`Modo de cámara: ${cameraMode}`);
            }
        });

        window.addEventListener("keyup", (e) => {
            keys[e.code] = false;
        });


        ////////////// Animación  
        const cameraSpeed = 0.01;
        const rotationSpeed = 0.002;

        animate();
        function animate() {
            requestAnimationFrame(animate);

            const now = performance.now();
            const deltaTime = (now - lastTime) / 1000;
            lastTime = now;

            handleCameraControls();
            for (const robot of robots) robot.update(deltaTime);

            updateCameraView();
            renderer1.render(scene, camera1);//Global
            renderer2.render(scene, camera2);//Carro
        }

        //////////////7 Help Func

        function selectRobot(idx) {
            if (robots[idx]) {
                selectedRobot = robots[idx];
                console.log("Robot " + idx + " selected");
            }
        }

        function setCameraMode(mode) {
            cameraMode = mode;
            console.log("Camera mode " + mode);
        }

        function updateCameraView() {
            if (!selectedRobot) return;
            const target = selectedRobot.group.position.clone();

            switch (cameraMode) {
                case "S":
                    camera2.position.set(target.x, 10, target.z);
                    camera2.lookAt(target);
                    break;
                case "P": {
                    const dir = new THREE.Vector3(
                        Math.cos(selectedRobot.state.beta),
                        0,
                        -Math.sin(selectedRobot.state.beta)
                    );

                    // posición de los "ojos" del robot
                    const eye = target.clone().add(new THREE.Vector3(0, 1.5, 0)).add(dir.multiplyScalar(.3));

                    // hacia dónde mira (un poco hacia abajo)
                    const lookAt = eye.clone()
                        .add(dir)            // adelante
                        .add(new THREE.Vector3(0, -0.07, 0)); // bajamos 0.2 en Y

                    camera2.position.copy(eye);
                    camera2.lookAt(lookAt);
                    break;
                }

                case "T": {
                    const dir = new THREE.Vector3(
                        Math.cos(selectedRobot.state.beta),
                        0,
                        -Math.sin(selectedRobot.state.beta)
                    );
                    const eye = target
                        .clone()
                        .add(new THREE.Vector3(0, 2, 0))
                        .sub(dir.multiplyScalar(5));
                    camera2.position.copy(eye);
                    camera2.lookAt(target.clone().add(new THREE.Vector3(0, 1, 0)));
                    break;
                }
                case "B": {
                    camera2.position.x =
                        Math.cos(
                            selectedRobot.armBase.rotation.y +
                            selectedRobot.base.rotation.y
                        ) * 2;
                    camera2.position.z =
                        Math.sin(
                            selectedRobot.armBase.rotation.y +
                            selectedRobot.base.rotation.y
                        ) * 2;
                    camera2.position.y = selectedRobot.armBase.position.y + 2;
                    camera2.lookAt(
                        selectedRobot.armBase.getWorldPosition(new THREE.Vector3())
                    );
                    break;
                }
            }
        }

        function coreografia() {
            // Choreography does not depend on a local ymca.mp3 file.
            // if (music.src) {
            //     music.currentTime = 0;
            //     music.play().catch(err => console.warn("Optional audio could not play:", err));
            // }
            set_sequences()
        }

        function handleCameraControls() {
            if (keys["KeyW"]) {
                camera1.position.x -= Math.sin(camera1.rotation.y) * cameraSpeed;
                camera1.position.z -= Math.cos(camera1.rotation.y) * cameraSpeed;
            }
            if (keys["KeyS"]) {
                camera1.position.x += Math.sin(camera1.rotation.y) * cameraSpeed;
                camera1.position.z += Math.cos(camera1.rotation.y) * cameraSpeed;
            }
            if (keys["KeyA"]) {
                camera1.position.x -= Math.cos(camera1.rotation.y) * cameraSpeed;
                camera1.position.z += Math.sin(camera1.rotation.y) * cameraSpeed;
            }
            if (keys["KeyD"]) {
                camera1.position.x += Math.cos(camera1.rotation.y) * cameraSpeed;
                camera1.position.z -= Math.sin(camera1.rotation.y) * cameraSpeed;
            }
            if (keys["ArrowLeft"]) camera1.rotation.y += rotationSpeed;
            if (keys["ArrowRight"]) camera1.rotation.y -= rotationSpeed;
            if (keys["ArrowUp"]) camera1.rotation.x += rotationSpeed;
            if (keys["ArrowDown"]) camera1.rotation.x -= rotationSpeed;
            if (keys["KeyI"]) camera1.position.y += cameraSpeed * 5;
            if (keys["KeyK"]) camera1.position.y -= cameraSpeed * 5;
            if (keys["KeyJ"]) camera1.position.x -= cameraSpeed;
            if (keys["KeyL"]) camera1.position.x += cameraSpeed;
        }
